version: "2"

run:
  tests: false
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (net.Conn).Close
        - (*database/sql.Tx).Rollback
        - (net/http.ResponseWriter).Write
        - encoding/json.Unmarshal
        - (*github.com/nats-io/nats.go.Subscription).Unsubscribe
        - (github.com/nats-io/nats.go.JetStreamMsg).Ack
        - (github.com/nats-io/nats.go.JetStreamMsg).Nak
        - (github.com/rbaliyan/event/v3/transport.Message).Ack
  exclusions:
    rules:
      - path: examples/
        linters:
          - errcheck
          - unused
