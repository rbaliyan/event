name: Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

# Integration runs against real Redis and Postgres service containers and
# is a required check on the main branch. The original stabilization flag
# (continue-on-error: true) was removed once the suite proved reliable
# through Phase 1 and Phase 2 of the test-quality lift.
jobs:
  integration:
    name: Integration (Redis + Postgres)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_ADDR: 127.0.0.1:6379
      POSTGRES_DSN: postgres://test:test@127.0.0.1:5432/test?sslmode=disable
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Run integration tests
        run: go test -tags=integration -race -count=1 -timeout=300s ./...
